[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-with-gnns"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "networkx>=3.6.1",
    "rich>=15.0.0",
    "sb3-contrib>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
    "torch-geometric>=2.8.0",
    "tqdm>=4.68.4",
]

[tool.setuptools.packages.find]
include = ["rl_with_gnns*"]
namespaces = false

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
notebooks = [
    "ipykernel>=7.3.0",
]
